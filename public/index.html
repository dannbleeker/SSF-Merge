<main>
  <span class="tick"></span>
  <h1>SSF Merge</h1>
  <p>Mail merge for PowerPoint. One template block of slides, one set of slides per row of your data, and formatting that survives because nothing re-authors it.</p>
  <p>The add-in is in development. Source and progress:
    <a href="https://github.com/dannbleeker/SSF-Merge">github.com/dannbleeker/SSF-Merge</a>.</p>
  <p>From <a href="https://struktureretsundfornuft.dk">StruktureretSundFornuft</a>.</p>
</main>
