name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs. Without this there is no way to put CI on a commit whose push
  # event was lost, which is what happens to every commit pushed while Actions
  # is disabled on a new repository: enabling it does not replay them, and the
  # head can sit untested behind a green parent.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
