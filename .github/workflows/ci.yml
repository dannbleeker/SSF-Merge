name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs. Without this there is no way to put CI on a commit whose push
  # event was lost, which is what happens to every commit pushed while Actions
  # is disabled on a new repository: enabling it does not replay them, and the
  # head can sit untested behind a green parent.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Ordered cheapest and most specific first, so a run that is going to fail
      # says why in seconds rather than after the whole suite.
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      # `typecheck` is `tsc --noEmit` and cannot see this: TypeScript 6 refused
      # to infer `rootDir` for the library build, so `npm run build:lib` exited
      # 2 while every gate stayed green. Nothing else here builds it, `dist-lib/`
      # is gitignored, and the two scripts that import it — `build-probe.mjs`
      # and `read-answers.mjs` — are only ever read as TEXT by the suite. So
      # `npm run probe` and `npm run answers` were dead on a fresh clone from
      # 2026-09-01, and no run said so.
      - name: Library build
        run: npm run build:lib
      # The PANE build, which is the artifact a user actually loads.
      #
      # Everything above checks the source; `npm run build` is what turns it
      # into `dist/`, and until 2026-09-01 no required check ran it. The only
      # place it happened was the Pages DEPLOY job, which is `push: main` only —
      # so a pull request that broke the bundle went green, merged, and failed
      # after the fact, with the deploy as the first thing to notice. That is
      # the same shape as the library build above, one artifact further out.
      - name: Pane build
        run: npm run build
      - name: Tests and coverage
        run: npm run coverage
      - name: Test count
        run: npm run test:count
      # The floor RAISES itself and exits 0, printing "Commit
      # test/fixtures/test-count.json" — advice nothing enforced. A run that
      # forgot to commit it therefore passed, and the floor stayed wherever it
      # was: the guard against deleted tests silently protecting a smaller
      # number than the suite has. Same pattern `release.yml` already uses for
      # the manifests.
      - name: Test count is recorded
        run: git diff --exit-code -- test/fixtures/test-count.json

  # Microsoft's own validator, kept OUT of `test` on purpose: it calls a
  # Microsoft service, so it can fail for reasons that have nothing to do with
  # the change, and `test` is the check a merge waits on. The offline rules in
  # `scripts/manifest-rules.mjs` run in `test` and hold the things this project
  # would actually be bitten by; this job is the authority on the schema.
  #
  # It is also the only thing here that can run at all: the validator answers
  # 403 through the development environment's egress proxy, so for the whole
  # life of this repo the manifests would otherwise never have been validated.
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The JSON manifests are in this loop and were not, for the whole life of
      # the repo — while `manifest-prod.json` is a RELEASE ASSET and the release
      # note points administrators deploying to a tenant at it. The highest-
      # consequence artifact here was the one no external authority read.
      #
      # Measured before it was added rather than assumed: the validator reads a
      # JSON manifest against its schema OFFLINE, needs no service for it, and
      # exits 1 on one missing `id`, missing `version` and carrying a wrong
      # `manifestVersion`. It exits 1 on an unreachable service too, so this
      # step cannot go green without a verdict.
      - name: Manifests are valid
        run: |
          for m in manifest.xml manifest-prod.xml manifest.json manifest-prod.json; do
            echo "--- $m"
            npx --yes office-addin-manifest validate "$m"
            # The tool prints "The manifest is valid." for XML and NOTHING AT
            # ALL for JSON, so a JSON line in this log is otherwise a filename
            # followed by silence — indistinguishable from a file it skipped.
            # It does validate them: a JSON manifest missing `id`, missing
            # `version` and carrying a wrong `manifestVersion` exits 1 with all
            # three named. This line is so the log says which happened.
            echo "$m: validated"
          done
