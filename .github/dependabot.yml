version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for the dev toolchain rather than five. A linter bump and a
      # prettier bump reviewed together is one CI run and one decision.
      #
      # MINOR AND PATCH ONLY, so a major arrives on its own. Grouped by
      # dependency type alone, this swept `vitest` 4 -> 5 into #233 welded to
      # eight routine bumps, and a group like that is all-or-nothing: holding
      # the major back means closing the pull request and losing the other
      # eight with it. That major was taken on 2026-09-14 and the gate was
      # wide enough to prove it — `test:count` reads vitest's own JSON
      # reporter, so a schema change would have gone red — but that is a fact
      # about this repository's gate rather than a property of the
      # arrangement. A major is the one update that earns its own CI run and
      # its own row in docs/DEPENDENCY-ALERTS.md.
      dev-tooling:
        dependency-type: development
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    ignore:
      # @types/node's major tracks the Node major it describes, and this repo
      # pins Node 22 in three places: .nvmrc, the engines field, and the Pages
      # workflow. Types ahead of the runtime are the dangerous direction — they
      # typecheck an API the runtime may not have, so the failure lands at run
      # time with a green build behind it.
      #
      # Honest limit on that claim: when Dependabot proposed 22 -> 26, the whole
      # gate passed under the newer types and five candidate Node-26 APIs all
      # turned out to exist in Node 22.22 as well. No break was reproduced. The
      # major is pinned because the alignment is free and the risk is
      # asymmetric, not because a failure was demonstrated.
      #
      # Raise this deliberately, together with .nvmrc, when the repo moves to a
      # newer Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

      # TypeScript 7 is the native Go port and it ships NO stable programmatic
      # compiler API. typescript-eslint reads that API to walk the AST and pull
      # type information, so every published version of it — 8.69.0 included —
      # caps its peer at "<6.1.0". Dependabot #190 proposed 5.9.3 -> 7.0.2 and
      # could not even install: npm ci died with ERESOLVE before a single type
      # was checked.
      #
      # This is not a thing this repository can fix. typescript-eslint#12518 was
      # closed as "not planned" because the fix belongs to TypeScript 7.1, which
      # is targeted at autumn 2026 and restores the programmatic API.
      #
      # So the repo took the intermediate step instead and is on TypeScript 6,
      # which is Microsoft's own recommended path: 6 deprecates, 7 removes.
      #
      # UN-IGNORE THIS when typescript-eslint publishes a version whose peer
      # range admits 7.x. That is the single condition; nothing else here needs
      # to change first.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      # One pull request for the whole workflow toolchain. Ungrouped, the first
      # run opened five: checkout, setup-node, configure-pages,
      # upload-pages-artifact and deploy-pages, each its own branch and its own
      # CI run, for a change nobody reviews line by line anyway.
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
